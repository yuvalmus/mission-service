# NATS for station B — dials out to station A's leaf port.
server_name: nats-b
port: 4222
http_port: 8222

jetstream {
    store_dir: /data/jetstream
    max_mem: 64M
    max_file: 256M
    # Must equal the station's NODE_NAME: the peer's mirror addresses this
    # station's JetStream API as $JS.<NODE_NAME>.API.
    domain: station-b
}

leafnodes {
    port: 7422
    remotes: [
        { url: "nats-leaf://station-a-nats:7422" }
    ]
}

websocket {
    port: 8080
    no_tls: true
}

debug: false
trace: false
logtime: true
