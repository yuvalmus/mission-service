# NATS for station A.
#
# Leaf nodes, not a JetStream cluster. A clustered JetStream elects a leader via
# Raft, which needs a majority — with two stations, losing one would leave the
# survivor unable to accept a message. A leaf node owns its own JetStream domain
# and keeps accepting writes alone, which is the whole requirement.
server_name: nats-a
port: 4222
http_port: 8222

jetstream {
    store_dir: /data/jetstream
    max_mem: 64M
    max_file: 256M
    # Must equal the station's NODE_NAME: the peer's mirror addresses this
    # station's JetStream API as $JS.<NODE_NAME>.API.
    domain: station-a
}

# Station A accepts the leaf connection; the link is bidirectional once open.
leafnodes {
    port: 7422
}

# Browsers connect straight to NATS over WebSocket, so real-time updates need no
# HTTP polling and no socket relay in the service.
websocket {
    port: 8080
    no_tls: true
}

debug: false
trace: false
logtime: true
