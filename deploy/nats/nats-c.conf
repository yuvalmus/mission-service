# NATS for station C — dials out to station A, or to station B when A is down.
server_name: nats-c
port: 4222
http_port: 8222

jetstream {
    store_dir: /data/jetstream
    max_mem: 64M
    max_file: 256M
    # Must equal the station's NODE_NAME: the peer's mirror addresses this
    # station's JetStream API as $JS.<NODE_NAME>.API.
    domain: station-c
}

leafnodes {
    port: 7422
    remotes: [
        { urls: ["nats-leaf://station-a-nats:7422", "nats-leaf://station-b-nats:7422"] }
    ]
}

websocket {
    port: 8080
    no_tls: true
}

debug: false
trace: false
logtime: true
