# PostgreSQL tuned for a 2014-era edge computer running the full stack on one box.
# Every setting here trades headroom for a smaller resident footprint.

listen_addresses = '*'
port = 5432

# --- pglogical ---------------------------------------------------------------
# wal_level = logical is what makes logical replication possible at all.
shared_preload_libraries = 'pglogical'
wal_level = logical
max_replication_slots = 10
max_wal_senders = 10
max_worker_processes = 10

# --- Conflict resolution -----------------------------------------------------
# The architecture requires Last-Write-Wins. pglogical's default is apply_remote,
# which on a concurrent edit makes each station apply the other's version: the
# two databases swap values and stay diverged forever. last_update_wins compares
# commit timestamps instead, which is what needs track_commit_timestamp.
track_commit_timestamp = on
pglogical.conflict_resolution = 'last_update_wins'

# --- Memory ------------------------------------------------------------------
# The application, NATS and the browser share this machine, so the database is
# deliberately not allowed to size itself as if it owned the hardware.
shared_buffers = 128MB
work_mem = 4MB
maintenance_work_mem = 32MB
effective_cache_size = 256MB

# --- Connections -------------------------------------------------------------
# Each backend costs a process. The service pools its connections, so a small
# ceiling is enough and keeps process overhead down.
max_connections = 20

# --- Write behaviour ---------------------------------------------------------
# Spinning or low-end flash storage: keep checkpoints spread out rather than
# letting them arrive as periodic stalls.
checkpoint_completion_target = 0.9
wal_compression = on
random_page_cost = 1.5

# --- Logging -----------------------------------------------------------------
log_min_messages = warning
log_min_duration_statement = 1000
log_statement = 'ddl'
log_line_prefix = '%m [%p] %q%u@%d '
