# The mesh runs on an isolated LAN with no route to the internet; peers connect
# from an address that is not known ahead of time, so the rule is written by
# subnet rather than by host. Password authentication is still required.
host    all             all             0.0.0.0/0               scram-sha-256
host    replication     all             0.0.0.0/0               scram-sha-256
